name: Build Web APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert HTML to APK
        uses: darkshredder/website-to-apk-action@v1
        with:
          build-folder-path: '.'
          app-name: 'FreeTime'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freetime-apk
          path: '**/*.apk'

